<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clash Mini</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;min-height:100vh;overflow-x:hidden}
  .top{position:sticky;top:0;z-index:10;background:#000;padding:14px 16px;border-bottom:1px solid #1a1a1a;text-align:center}
  .top h1{font-size:13px;letter-spacing:4px;font-weight:700;text-transform:uppercase}
  .screen{display:none;padding:16px 16px 90px;animation:fade .2s}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .btn{width:100%;padding:16px;background:#fff;color:#000;border:1px solid #fff;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-bottom:10px}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:#fff}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#777;margin-bottom:7px}
  .field input{width:100%;padding:15px;background:#0d0d0d;border:1px solid #222;color:#fff;font-family:inherit;font-size:15px;outline:none}
  .field input:focus{border-color:#fff}
  .field input.code{font-family:'SF Mono',monospace;font-size:26px;text-align:center;letter-spacing:8px;font-weight:700;padding-left:26px}
  .code-box{border:1px solid #fff;padding:24px 18px;text-align:center;margin:16px 0}
  .code-box .lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#777;margin-bottom:10px}
  .code-box .code{font-family:'SF Mono',monospace;font-size:38px;font-weight:700;letter-spacing:6px;margin-bottom:16px}
  .arena{width:100%;background:#0d0d0d;border:1px solid #222;margin-bottom:14px;position:relative;height:120px}
  canvas{width:100%;height:100%;display:block}
  .hud{display:flex;justify-content:space-between;margin-bottom:14px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#888}
  .hud .hp{color:#fff;font-weight:700}
  .hand{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
  .card{border:1px solid #222;background:#0d0d0d;padding:10px 6px;text-align:center;cursor:pointer}
  .card:active{border-color:#fff}
  .card.disabled{opacity:.3;pointer-events:none}
  .card .n{font-size:11px;font-weight:700;margin-bottom:4px}
  .card .c{font-size:14px;font-weight:700;color:#a855f7}
  .card .s{font-size:10px;color:#666;margin-top:2px}
  .elixir{height:10px;background:#1a1a1a;border:1px solid #222;margin-bottom:14px;position:relative;overflow:hidden}
  .elixir-fill{height:100%;background:#a855f7;transition:width .3s;width:50%}
  .status{text-align:center;font-size:12px;color:#888;letter-spacing:1px;margin-bottom:14px}
  .status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff4444;margin-right:6px}
  .status .dot.on{background:#44ff88}
</style>
</head>
<body>

<div class="top"><h1 id="title">CLASH MINI</h1></div>

<div id="s-menu" class="screen active">
  <button class="btn" onclick="go('create')">СОЗДАТЬ ИГРУ</button>
  <button class="btn ghost" onclick="go('join')">ПРИСОЕДИНИТЬСЯ</button>
</div>

<div id="s-create" class="screen">
  <div id="createForm">
    <div class="field"><label>Твоё имя</label><input id="createName" type="text" placeholder="Игрок"></div>
    <button class="btn" onclick="createGame()">СОЗДАТЬ</button>
  </div>
  <div id="createResult" class="hidden">
    <div class="code-box">
      <div class="lbl">КОД ИГРЫ</div>
      <div class="code" id="newCode">000000</div>
      <button class="btn ghost" onclick="copyCode()" id="copyBtn">СКОПИРОВАТЬ</button>
    </div>
    <button class="btn" onclick="enterGame()">ВОЙТИ</button>
  </div>
</div>

<div id="s-join" class="screen">
  <div class="field"><label>Твоё имя</label><input id="joinName" type="text" placeholder="Игрок"></div>
  <div class="field"><label>Код игры</label><input id="joinCode" type="tel" inputmode="numeric" maxlength="6" class="code" placeholder="000000"></div>
  <button class="btn" onclick="joinGame()">ВОЙТИ</button>
</div>

<div id="s-game" class="screen">
  <div class="status"><span class="dot" id="wsDot"></span><span id="wsStatus">ПОДКЛЮЧЕНИЕ...</span></div>
  <div class="hud">
    <span>ТЫ: <span class="hp" id="myHp">100</span> HP</span>
    <span>ВРАГ: <span class="hp" id="enemyHp">100</span> HP</span>
  </div>
  <div class="arena"><canvas id="arena"></canvas></div>
  <div class="elixir"><div class="elixir-fill" id="elixirFill"></div></div>
  <div class="hand" id="hand"></div>
  <button class="btn ghost" onclick="leaveGame()">ВЫЙТИ</button>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const USER_ID = tg?.initDataUnsafe?.user?.id || Date.now();

let ws = null, code = null, mySide = null;
let state = {players:{white:null,black:null}, units:[]};
const cards = [
  {id:1,name:'Гоблин',cost:2,atk:8,hp:15},
  {id:2,name:'Лучник',cost:3,atk:12,hp:20},
  {id:3,name:'Рыцарь',cost:4,atk:18,hp:35},
  {id:4,name:'Гигант',cost:5,atk:25,hp:60},
];

function go(s) {
  document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
  document.getElementById('s-' + s).classList.add('active');
  if (s === 'game') resizeArena();
}

async function createGame() {
  const name = document.getElementById('createName').value.trim() || 'Игрок';
  const r = await fetch('/api/game/create', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:USER_ID,username:name})});
  const d = await r.json();
  code = d.code; mySide = 'white';
  document.getElementById('newCode').textContent = d.code;
  document.getElementById('createForm').classList.add('hidden');
  document.getElementById('createResult').classList.remove('hidden');
}
function copyCode() {
  const c = document.getElementById('newCode').textContent;
  navigator.clipboard.writeText(c).then(()=>{const b=document.getElementById('copyBtn');b.textContent='СКОПИРОВАНО ✓';setTimeout(()=>b.textContent='СКОПИРОВАТЬ',1500)});
}
function enterGame() { if (code) openGame(); }

async function joinGame() {
  const name = document.getElementById('joinName').value.trim() || 'Игрок';
  const c = document.getElementById('joinCode').value.trim();
  if (c.length !== 6) { tg?.showAlert?.('Код из 6 цифр'); return; }
  const r = await fetch('/api/game/join', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:c,user_id:USER_ID,username:name})});
  const d = await r.json();
  if (!d.ok) { tg?.showAlert?.(d.error); return; }
  code = c; mySide = 'black';
  openGame();
}

function openGame() {
  go('game');
  connectWS();
  renderHand();
}

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/game/${code}`);
  ws.onopen = () => setDot(true);
  ws.onclose = () => setDot(false);
  ws.onmessage = e => handleWS(JSON.parse(e.data));
}

function setDot(on) {
  document.getElementById('wsDot').classList.toggle('on', on);
  document.getElementById('wsStatus').textContent = on ? 'В СЕТИ' : 'НЕТ СВЯЗИ';
}

function handleWS(msg) {
  if (msg.type === 'state') {
    state = msg.state;
    render();
  } else if (msg.type === 'gameover') {
    tg?.showAlert?.(msg.winner === mySide ? '🏆 ПОБЕДА!' : '💀 ПОРАЖЕНИЕ');
    leaveGame();
  }
}

function renderHand() {
  const h = document.getElementById('hand');
  h.innerHTML = cards.map(c => `
    <div class="card" data-id="${c.id}" onclick="playCard(${c.id})">
      <div class="n">${c.name}</div>
      <div class="c">${c.cost}⚡</div>
      <div class="s">${c.atk}/${c.hp}</div>
    </div>`).join('');
}

function playCard(id) {
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({type:'play_card', player:mySide, card_id:id}));
}

function resizeArena() {
  const c = document.getElementById('arena');
  const w = c.parentElement.clientWidth;
  c.width = w; c.height = 120;
  draw();
}
window.addEventListener('resize', () => { if (document.getElementById('s-game').classList.contains('active')) resizeArena(); });

function draw() {
  const c = document.getElementById('arena');
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  ctx.clearRect(0,0,w,h);
  const cell = w / 10;
  // фон поля
  for (let i = 0; i < 10; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#0d0d0d' : '#111';
    ctx.fillRect(i*cell, 0, cell, h);
  }
  // башни
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, h/2-25, cell*0.7, 50);
  ctx.fillStyle = '#333';
  ctx.fillRect(w-cell*0.7, h/2-25, cell*0.7, 50);
  // юниты
  for (const u of state.units) {
    const x = u.pos * cell + cell/2;
    const y = h/2;
    ctx.beginPath();
    ctx.arc(x, y, cell*0.35, 0, Math.PI*2);
    ctx.fillStyle = u.owner === 'white' ? '#fff' : '#555';
    ctx.fill();
    ctx.fillStyle = u.owner === 'white' ? '#000' : '#fff';
    ctx.font = 'bold ' + Math.floor(cell*0.35) + 'px -apple-system';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(u.name[0], x, y+1);
  }
}

function render() {
  const me = state.players[mySide];
  const enemy = state.players[mySide === 'white' ? 'black' : 'white'];
  document.getElementById('myHp').textContent = me ? me.tower_hp : 100;
  document.getElementById('enemyHp').textContent = enemy ? enemy.tower_hp : 100;
  const elixir = me ? me.elixir : 0;
  document.getElementById('elixirFill').style.width = (elixir/10*100) + '%';
  document.querySelectorAll('.card').forEach(el => {
    const id = Number(el.dataset.id);
    const card = cards.find(c => c.id === id);
    el.classList.toggle('disabled', !me || elixir < card.cost);
  });
  draw();
}

function leaveGame() {
  ws?.close?.(); ws = null; code = null; state = {players:{white:null,black:null},units:[]};
  document.getElementById('createForm').classList.remove('hidden');
  document.getElementById('createResult').classList.add('hidden');
  go('menu');
}

document.getElementById('joinCode').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g,''); });
</script>
</body>
</html>
