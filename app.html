<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кинотеатр</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#000; --fg:#fff; --dim:#888; --line:#222; --card:#0d0d0d; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
    min-height:100vh; padding-bottom:80px; overflow-x:hidden;
  }
  .top {
    position:sticky; top:0; z-index:10; background:var(--bg);
    padding:16px 20px 12px; border-bottom:1px solid var(--line);
  }
  .top h1 { font-size:14px; letter-spacing:4px; font-weight:700; text-transform:uppercase; text-align:center; }
  .screen { display:none; padding:20px; animation:fade .25s ease; }
  .screen.active { display:block; }
  @keyframes fade { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }

  .search { display:flex; gap:10px; margin-bottom:16px; }
  .search input {
    flex:1; background:var(--card); border:1px solid var(--line); color:var(--fg);
    padding:14px 16px; font-size:15px; font-family:inherit; outline:none; border-radius:0;
  }
  .search input:focus { border-color:var(--fg); }
  .search button {
    background:var(--fg); color:var(--bg); border:none; padding:0 18px;
    font-weight:700; font-size:13px; letter-spacing:1px; cursor:pointer; font-family:inherit;
  }
  .genres { display:flex; gap:8px; overflow-x:auto; padding-bottom:16px; scrollbar-width:none; }
  .genres::-webkit-scrollbar { display:none; }
  .genre {
    background:transparent; color:var(--dim); border:1px solid var(--line);
    padding:7px 14px; font-size:12px; white-space:nowrap; cursor:pointer;
    font-family:inherit; text-transform:lowercase; border-radius:20px;
  }
  .genre.active { border-color:var(--fg); color:var(--fg); }

  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .card {
    position:relative; aspect-ratio:2/3; background:var(--card);
    border:1px solid var(--line); overflow:hidden; cursor:pointer; transition:border-color .15s;
  }
  .card:active { border-color:var(--fg); }
  .card img { width:100%; height:100%; object-fit:cover; display:block; }
  .card .t {
    position:absolute; bottom:0; left:0; right:0; padding:8px 6px 6px;
    background:linear-gradient(transparent,#000); font-size:11px; line-height:1.15; font-weight:600;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card .r {
    position:absolute; top:6px; right:6px; background:#000; border:1px solid var(--fg);
    padding:2px 6px; font-size:10px; font-weight:700;
  }

  .msg { padding:40px 20px; text-align:center; color:var(--dim); font-size:13px; letter-spacing:.5px; }
  .empty-state { text-align:center; padding:60px 20px; color:var(--dim); font-size:13px; letter-spacing:1px; }

  .detail-hero { position:relative; height:380px; background:var(--card); margin:-20px -20px 0; }
  .detail-hero img { width:100%; height:100%; object-fit:cover; display:block; }
  .detail-hero .grad { position:absolute; inset:0; background:linear-gradient(transparent 50%,var(--bg)); }
  .detail-hero .back {
    position:absolute; top:16px; left:16px; width:40px; height:40px;
    background:rgba(0,0,0,.7); color:var(--fg); border:1px solid var(--fg); border-radius:50%;
    font-size:18px; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; justify-content:center;
  }
  .detail-body { position:relative; margin-top:-40px; }
  .detail-body h2 { font-size:22px; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:8px; line-height:1.2; }
  .detail-body .meta { color:var(--dim); font-size:12px; letter-spacing:1px; margin-bottom:20px; text-transform:uppercase; }
  .detail-body .plot { font-size:14px; line-height:1.6; color:#ccc; margin-bottom:28px; }

  .btn {
    width:100%; padding:18px; background:var(--fg); color:var(--bg);
    border:1px solid var(--fg); font-family:inherit; font-size:14px; font-weight:700;
    letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:all .15s;
  }
  .btn:active { transform:scale(.98); }
  .btn.ghost { background:transparent; color:var(--fg); }
  .btn.ghost:active { background:var(--fg); color:var(--bg); }

  .field { margin-bottom:16px; }
  .field label {
    display:block; font-size:11px; letter-spacing:2px; text-transform:uppercase;
    color:var(--dim); margin-bottom:8px;
  }
  .field input {
    width:100%; padding:16px; background:var(--card); border:1px solid var(--line);
    color:var(--fg); font-family:inherit; font-size:15px; outline:none;
  }
  .field input:focus { border-color:var(--fg); }
  .field input.code-input {
    font-family:'SF Mono','Courier New',monospace; font-size:28px; text-align:center;
    letter-spacing:8px; font-weight:700;
  }

  .code-box { border:2px solid var(--fg); padding:28px 20px; text-align:center; margin:20px 0; }
  .code-box .lbl { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--dim); margin-bottom:12px; }
  .code-box .code {
    font-family:'SF Mono','Courier New',monospace; font-size:40px; font-weight:700;
    letter-spacing:8px; margin-bottom:20px;
  }

  .session-card { border:1px solid var(--line); padding:20px; margin-bottom:12px; background:var(--card); }
  .session-card .title { font-size:16px; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
  .session-card .sub { color:var(--dim); font-size:12px; letter-spacing:1px; }

  .nav {
    position:fixed; bottom:0; left:0; right:0; background:var(--bg); border-top:1px solid var(--line);
    display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:20;
  }
  .nav button {
    flex:1; padding:14px 8px; background:transparent; border:none; color:var(--dim);
    font-family:inherit; font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .nav button.active { color:var(--fg); }
  .nav button .ico { font-size:18px; }

  .hidden { display:none !important; }
</style>
</head>
<body>

<div class="top"><h1 id="screenTitle">КАТАЛОГ</h1></div>

<!-- CATALOG -->
<div id="s-catalog" class="screen active">
  <div class="search">
    <input id="q" type="text" placeholder="Поиск фильмов...">
    <button onclick="doSearch()">→</button>
  </div>
  <div class="genres" id="genres"></div>
  <div id="catalogBody"><div class="msg">ЗАГРУЗКА...</div></div>
</div>

<!-- FILM -->
<div id="s-film" class="screen">
  <div class="detail-hero">
    <button class="back" onclick="go('catalog')">←</button>
    <img id="fPoster" src="" alt="">
    <div class="grad"></div>
  </div>
  <div class="detail-body">
    <h2 id="fTitle">—</h2>
    <div class="meta" id="fMeta">—</div>
    <div class="plot" id="fPlot"></div>
    <button class="btn" onclick="createSessionForCurrent()">СОЗДАТЬ КОМНАТУ</button>
  </div>
</div>

<!-- CREATE -->
<div id="s-create" class="screen">
  <div id="createForm">
    <div class="field">
      <label>Название комнаты</label>
      <input id="sessName" type="text" placeholder="Вечерний просмотр">
    </div>
    <div class="field">
      <label>Фильм</label>
      <input id="sessFilm" type="text" placeholder="Выбери из каталога (необязательно)" readonly>
    </div>
    <button class="btn" onclick="createSession()">СОЗДАТЬ</button>
  </div>
  <div id="createResult" class="hidden">
    <div class="code-box">
      <div class="lbl">КОД КОМНАТЫ</div>
      <div class="code" id="newCode">000000</div>
      <button class="btn ghost" onclick="copyCode()" id="copyBtn">СКОПИРОВАТЬ</button>
    </div>
    <div class="session-card">
      <div class="title" id="createdTitle">—</div>
      <div class="sub">Передай код друзьям</div>
    </div>
    <button class="btn ghost" onclick="resetCreate()" style="margin-top:12px">НОВАЯ КОМНАТА</button>
  </div>
</div>

<!-- JOIN -->
<div id="s-join" class="screen">
  <div class="field">
    <label>Код комнаты</label>
    <input id="joinCode" type="tel" inputmode="numeric" maxlength="6" class="code-input" placeholder="000000">
  </div>
  <button class="btn" onclick="joinSession()">ВОЙТИ</button>
  <div id="joinResult" style="margin-top:20px"></div>
</div>

<!-- ROOM -->
<div id="s-room" class="screen"><div id="roomBody"></div></div>

<div class="nav">
  <button data-screen="catalog" class="active" onclick="go('catalog')"><span class="ico">▦</span><span>КАТАЛОГ</span></button>
  <button data-screen="create" onclick="go('create')"><span class="ico">＋</span><span>СОЗДАТЬ</span></button>
  <button data-screen="join" onclick="go('join')"><span class="ico">→</span><span>ВОЙТИ</span></button>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const USER_ID = tg?.initDataUnsafe?.user?.id || 0;
const USERNAME = tg?.initDataUnsafe?.user?.username || 'guest';

let currentFilm = null;
let currentGenre = '';

const TITLES = { catalog:'КАТАЛОГ', film:'ФИЛЬМ', create:'СОЗДАТЬ', join:'ВОЙТИ', room:'КОМНАТА' };

function go(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('s-' + screen).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.screen === screen));
  document.getElementById('screenTitle').textContent = TITLES[screen] || '';
  window.scrollTo(0, 0);
}

// ===== CATALOG =====
const GENRES = ['Все','боевик','комедия','драма','фантастика','ужасы','триллер','мелодрама','детектив','приключения','фэнтези','аниме'];

function renderGenres() {
  const el = document.getElementById('genres');
  el.innerHTML = GENRES.map(g => `<button class="genre${g==='Все'?' active':''}" data-g="${g==='Все'?'':g}">${g}</button>`).join('');
  el.querySelectorAll('.genre').forEach(b => {
    b.onclick = () => {
      el.querySelectorAll('.genre').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      currentGenre = b.dataset.g;
      loadCatalog();
    };
  });
}

function extractFilms(data) {
  if (!data) return [];
  if (Array.isArray(data)) return data;
  return data.films || data.items || data.results || data.docs || [];
}
function fId(f) { return f.id || f.filmId || f.kinopoiskId || f.kp_id; }
function fName(f) { return f.name || f.title || f.nameRu || f.name_ru || '—'; }
function fPoster(f) { return f.poster || f.posterUrl || f.image || f.cover || f.coverUrl || ''; }
function fRating(f) {
  const r = f.rating || f.kp_rating || f.kpRating || f.imdbRating || f.score;
  return r ? Number(r).toFixed(1) : '';
}
function fYear(f) { return f.year || (f.releaseDate ? String(f.releaseDate).slice(0,4) : ''); }

async function loadCatalog() {
  const body = document.getElementById('catalogBody');
  body.innerHTML = '<div class="msg">ЗАГРУЗКА...</div>';
  try {
    const url = '/api/catalog' + (currentGenre ? '?genre=' + encodeURIComponent(currentGenre) : '');
    const r = await fetch(url);
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'Ошибка');
    renderFilms(extractFilms(data.films));
  } catch (e) {
    body.innerHTML = `<div class="msg">⚠ ${e.message}</div>`;
  }
}

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) return loadCatalog();
  const body = document.getElementById('catalogBody');
  body.innerHTML = '<div class="msg">ПОИСК...</div>';
  try {
    const r = await fetch('/api/catalog?q=' + encodeURIComponent(q));
    const data = await r.json();
    if (!data.ok) throw new Error(data.error);
    renderFilms(extractFilms(data.films));
  } catch (e) { body.innerHTML = `<div class="msg">⚠ ${e.message}</div>`; }
}

function renderFilms(films) {
  const body = document.getElementById('catalogBody');
  if (!films || !films.length) { body.innerHTML = '<div class="empty-state">НИЧЕГО НЕ НАЙДЕНО</div>'; return; }
  window.__films = films;
  body.innerHTML = '<div class="grid">' + films.map((f, i) => {
    const p = fPoster(f), n = fName(f), r = fRating(f);
    return `<div class="card" data-idx="${i}">
      ${p ? `<img src="${p}" loading="lazy" onerror="this.style.display='none'">` : ''}
      ${r ? `<div class="r">${r}</div>` : ''}
      <div class="t">${n}</div>
    </div>`;
  }).join('') + '</div>';
  body.querySelectorAll('.card').forEach(c => {
    c.onclick = () => openFilm(films[Number(c.dataset.idx)]);
  });
}

async function openFilm(film) {
  currentFilm = film;
  document.getElementById('fPoster').src = fPoster(film);
  document.getElementById('fTitle').textContent = fName(film);
  document.getElementById('fMeta').textContent = [fYear(film), fRating(film)?'★ '+fRating(film):''].filter(Boolean).join('  ·  ');
  document.getElementById('fPlot').textContent = film.description || film.plot || film.overview || 'Загрузка...';
  go('film');
  const id = fId(film);
  if (!id) return;
  try {
    const r = await fetch('/api/film/' + id);
    const data = await r.json();
    if (data.ok && data.film) {
      const f = data.film;
      currentFilm = f;
      document.getElementById('fPoster').src = fPoster(f) || fPoster(film);
      document.getElementById('fTitle').textContent = fName(f);
      document.getElementById('fMeta').textContent = [fYear(f), fRating(f)?'★ '+fRating(f):''].filter(Boolean).join('  ·  ');
      document.getElementById('fPlot').textContent = f.description || f.plot || f.overview || '';
    }
  } catch(e) {}
}

// ===== CREATE =====
function createSessionForCurrent() {
  if (currentFilm) {
    document.getElementById('sessFilm').value = fName(currentFilm);
    document.getElementById('sessName').value = fName(currentFilm);
  }
  go('create');
}

async function createSession() {
  const name = document.getElementById('sessName').value.trim() || 'Комната';
  try {
    const r = await fetch('/api/session/create', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        name,
        film: currentFilm ? { id: fId(currentFilm), title: fName(currentFilm), poster: fPoster(currentFilm) } : null,
        user_id: USER_ID, username: USERNAME
      })
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'Ошибка');
    document.getElementById('newCode').textContent = data.code;
    document.getElementById('createdTitle').textContent = name;
    document.getElementById('createForm').classList.add('hidden');
    document.getElementById('createResult').classList.remove('hidden');
  } catch (e) { tg?.showAlert?.('Ошибка: ' + e.message); }
}

function copyCode() {
  const code = document.getElementById('newCode').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const b = document.getElementById('copyBtn');
    b.textContent = 'СКОПИРОВАНО ✓';
    setTimeout(() => b.textContent = 'СКОПИРОВАТЬ', 1800);
  });
}

function resetCreate() {
  document.getElementById('sessName').value = '';
  document.getElementById('sessFilm').value = '';
  document.getElementById('createForm').classList.remove('hidden');
  document.getElementById('createResult').classList.add('hidden');
  currentFilm = null;
}

// ===== JOIN =====
async function joinSession() {
  const code = document.getElementById('joinCode').value.trim();
  if (code.length !== 6) { tg?.showAlert?.('Код из 6 цифр'); return; }
  try {
    const r = await fetch('/api/session/join', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code, user_id: USER_ID, username: USERNAME })
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'Комната не найдена');
    renderRoom(data.session);
    go('room');
  } catch (e) {
    document.getElementById('joinResult').innerHTML = `<div class="msg" style="padding:20px">⚠ ${e.message}</div>`;
  }
}

function renderRoom(s) {
  const body = document.getElementById('roomBody');
  body.innerHTML = `
    <div class="code-box">
      <div class="lbl">КОД КОМНАТЫ</div>
      <div class="code">${s.code}</div>
    </div>
    <div class="session-card">
      <div class="title">${s.name || 'Комната'}</div>
      <div class="sub">${s.film?.title || 'Фильм не выбран'}</div>
    </div>
    <div class="session-card">
      <div class="title">УЧАСТНИКИ · ${s.participants.length}</div>
      <div class="sub">${s.participants.map(p => '@' + (p.username || 'guest')).join(' · ')}</div>
    </div>
    <button class="btn ghost" onclick="go('catalog')" style="margin-top:12px">В КАТАЛОГ</button>
  `;
}

// ===== INIT =====
renderGenres();
loadCatalog();
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
document.getElementById('joinCode').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '');
});
</script>
</body>
</html>
