<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Royale 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #top-panel {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            pointer-events: auto;
            z-index: 100;
        }
        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 14px;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        #bottom-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            pointer-events: auto;
            z-index: 100;
        }
        #elixir-bar {
            width: 200px;
            height: 20px;
            background: #333;
            border: 2px solid #0f0;
            border-radius: 5px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }
        #elixir-fill {
            height: 100%;
            background: #0f0;
            width: 0%;
            transition: width 0.2s;
        }
        #elixir-text {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: white;
        }
        #hand {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .card {
            width: 60px;
            height: 80px;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            border: 2px solid #7f8c8d;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            pointer-events: auto;
        }
        .card.selected {
            border-color: #f1c40f;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }
        .card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .card-icon {
            font-size: 24px;
            font-weight: bold;
        }
        .card-cost {
            font-size: 12px;
            margin-top: 4px;
            color: #f1c40f;
        }
        #messages {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            max-width: 300px;
            text-align: center;
            pointer-events: auto;
            z-index: 50;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="top-panel">
            <div class="stat">
                <span>Time</span>
                <span class="stat-value" id="timer">3:00</span>
            </div>
            <div class="stat">
                <span>Score</span>
                <span class="stat-value" id="score">0 : 0</span>
            </div>
        </div>
        <div id="messages"></div>
        <div id="bottom-panel">
            <div id="elixir-bar">
                <div id="elixir-fill"></div>
                <div id="elixir-text">0/10</div>
            </div>
            <div id="hand"></div>
        </div>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 50, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: true, pixelRatio: Math.min(window.devicePixelRatio, 2) });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;
        document.body.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(9, 14, 11);
        camera.lookAt(9, 16, 0);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x8d7ae5, 0.8);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.far = 50;
        scene.add(dirLight);

        const groundGeom = new THREE.PlaneGeometry(18, 32);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a6b34 });
        const ground = new THREE.Mesh(groundGeom, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const riverGeom = new THREE.PlaneGeometry(18, 2);
        const riverMat = new THREE.MeshStandardMaterial({ color: 0x1e90ff });
        const river = new THREE.Mesh(riverGeom, riverMat);
        river.rotation.x = -Math.PI / 2;
        river.position.z = -15.5;
        river.receiveShadow = true;
        scene.add(river);

        const bridgeGeom = new THREE.BoxGeometry(2, 0.5, 2);
        const bridgeMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
        const bridge1 = new THREE.Mesh(bridgeGeom, bridgeMat);
        bridge1.position.set(3.5, 0.25, -15.5);
        bridge1.castShadow = true;
        scene.add(bridge1);
        const bridge2 = new THREE.Mesh(bridgeGeom, bridgeMat);
        bridge2.position.set(13.5, 0.25, -15.5);
        bridge2.castShadow = true;
        scene.add(bridge2);

        const towers = {};
        const towerPositions = {
            bottom: { princess_left: [3, 0, -28], princess_right: [14, 0, -28], king: [8.5, 0, -30] },
            top: { princess_left: [3, 0, 3], princess_right: [14, 0, 3], king: [8.5, 0, 1] }
        };

        function createTower(kind, x, y, z, color, side) {
            const group = new THREE.Group();
            const cylinderGeom = new THREE.CylinderGeometry(kind === "king" ? 1.2 : 0.8, kind === "king" ? 1.2 : 0.8, kind === "king" ? 4 : 2.5, 16);
            const towerMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.3, roughness: 0.4 });
            const body = new THREE.Mesh(cylinderGeom, towerMat);
            body.position.y = kind === "king" ? 2 : 1.25;
            body.castShadow = true;
            group.add(body);

            const coneGeom = new THREE.ConeGeometry(kind === "king" ? 1.5 : 1, kind === "king" ? 1.5 : 1, 16);
            const cone = new THREE.Mesh(coneGeom, towerMat);
            cone.position.y = kind === "king" ? 3.75 : 3;
            cone.castShadow = true;
            group.add(cone);

            group.position.set(x, y, z);
            scene.add(group);

            towers[`${side}_${kind}`] = { group: group, health_bars: [] };
        }

        createTower("princess", 3, 0, -28, 0x4a7fb5, "bottom");
        createTower("princess", 14, 0, -28, 0x4a7fb5, "bottom");
        createTower("king", 8.5, 0, -30, 0x4a7fb5, "bottom");
        createTower("princess", 3, 0, 3, 0xb54a4a, "top");
        createTower("princess", 14, 0, 3, 0xb54a4a, "top");
        createTower("king", 8.5, 0, 1, 0xb54a4a, "top");

        const units = {};
        const unitMeshes = {};

        function createUnit(id, owner, x, y) {
            const group = new THREE.Group();
            const capsuleGeom = new THREE.CapsuleGeometry(0.35, 0.8, 4, 8);
            const unitColor = owner === "bottom" ? 0x5aa0e0 : 0xe05a5a;
            const unitMat = new THREE.MeshStandardMaterial({ color: unitColor });
            const body = new THREE.Mesh(capsuleGeom, unitMat);
            body.castShadow = true;
            group.add(body);

            group.position.set(x, 0.5, -y);
            scene.add(group);

            const hpGeom = new THREE.PlaneGeometry(1, 0.15);
            const hpMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
            const hpBar = new THREE.Mesh(hpGeom, hpMat);
            hpBar.position.set(0, 1.2, 0);
            hpBar.rotation.x = -Math.PI / 2;
            group.add(hpBar);

            units[id] = { group: group, x: x, y: y, last_x: x, last_y: y, hp: 100, max_hp: 100, hpBar: hpBar };
            unitMeshes[id] = group;
        }

        const ws_protocol = location.protocol === "https:" ? "wss" : "ws";
        let ws = null;
        let gameCode = null;
        let currentSide = null;
        let selectedCard = null;
        let gameState = null;

        const cardIcons = { hog: "🐷", musketeer: "🏹", ice_spirit: "❄", skeletons: "💀", ice_golem: "🧊", cannon: "🎯", fireball: "🔥", log: "🪵" };
        const cardCosts = { hog: 4, musketeer: 4, ice_spirit: 1, skeletons: 1, ice_golem: 2, cannon: 3, fireball: 4, log: 2 };

        async function createGame() {
            const res = await fetch("/api/game/create", { method: "POST" });
            const data = await res.json();
            gameCode = data.code;
            await joinGame();
        }

        async function joinGame() {
            if (!gameCode) {
                const params = new URLSearchParams(location.search);
                gameCode = params.get("code");
            }
            if (!gameCode) {
                await createGame();
                return;
            }

            const tg = window.Telegram?.WebApp;
            const userId = tg?.initDataUnsafe?.user?.id || Math.floor(Math.random() * 1000000);
            const username = tg?.initDataUnsafe?.user?.username || "Player";

            const res = await fetch("/api/game/join", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ code: gameCode, user_id: userId, username: username })
            });
            const data = await res.json();
            if (data.ok) {
                currentSide = data.side;
                connectWebSocket();
            }
        }

        function connectWebSocket() {
            ws = new WebSocket(`${ws_protocol}://${location.host}/ws/game/${gameCode}`);
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === "state") {
                    gameState = msg.state;
                    updateUI();
                }
            };
        }

        function updateUI() {
            if (!gameState) return;

            const timer = gameState.timer;
            const minutes = Math.floor(timer / 60);
            const seconds = timer % 60;
            document.getElementById("timer").textContent = `${minutes}:${seconds.toString().padStart(2, "0")}`;

            const crowns = gameState.crowns;
            document.getElementById("score").textContent = `${crowns.bottom} : ${crowns.top}`;

            const player = gameState.players[currentSide];
            if (player) {
                const elixir = player.elixir;
                const pct = (elixir / 10) * 100;
                document.getElementById("elixir-fill").style.width = pct + "%";
                document.getElementById("elixir-text").textContent = `${Math.floor(elixir)}/10`;

                const handDiv = document.getElementById("hand");
                handDiv.innerHTML = "";
                player.hand.forEach((card, idx) => {
                    const cardEl = document.createElement("div");
                    cardEl.className = "card";
                    if (selectedCard === idx) cardEl.classList.add("selected");
                    if (elixir < cardCosts[card]) cardEl.classList.add("disabled");

                    cardEl.innerHTML = `<div class="card-icon">${cardIcons[card] || "?"}</div><div class="card-cost">${cardCosts[card]}</div>`;
                    cardEl.addEventListener("click", () => {
                        selectedCard = selectedCard === idx ? null : idx;
                        updateUI();
                    });
                    handDiv.appendChild(cardEl);
                });
            }

            for (const unitId in gameState.units) {
                const serverUnit = gameState.units.find(u => u.id === unitId);
                if (!serverUnit) continue;

                if (!units[unitId]) {
                    createUnit(unitId, serverUnit.owner, serverUnit.x, serverUnit.y);
                }

                const localUnit = units[unitId];
                localUnit.last_x = localUnit.x;
                localUnit.last_y = localUnit.y;
                localUnit.x = serverUnit.x;
                localUnit.y = serverUnit.y;
                localUnit.hp = serverUnit.hp;
                localUnit.max_hp = serverUnit.max_hp;

                const hpRatio = Math.max(0, localUnit.hp / localUnit.max_hp);
                localUnit.hpBar.scale.x = hpRatio;
                if (hpRatio > 0.5) localUnit.hpBar.material.color.setHex(0x00ff00);
                else if (hpRatio > 0.25) localUnit.hpBar.material.color.setHex(0xffff00);
                else localUnit.hpBar.material.color.setHex(0xff0000);
            }

            for (const unitId in units) {
                if (!gameState.units.find(u => u.id === unitId)) {
                    scene.remove(units[unitId].group);
                    delete units[unitId];
                    delete unitMeshes[unitId];
                }
            }
        }

        function animateUnits() {
            for (const unitId in units) {
                const unit = units[unitId];
                const alpha = 0.8;
                const interpX = unit.last_x + (unit.x - unit.last_x) * alpha;
                const interpY = unit.last_y + (unit.y - unit.last_y) * alpha;
                unit.group.position.x = interpX;
                unit.group.position.z = -interpY;
            }
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener("click", (event) => {
            if (selectedCard === null || !gameState || !gameState.players[currentSide]) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const intersect = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, intersect);

            const cellX = intersect.x;
            const cellY = -intersect.z;

            if (cellX < 0 || cellX > 18 || cellY < 0 || cellY > 32) return;

            const card = gameState.players[currentSide].hand[selectedCard];
            if (gameState.players[currentSide].elixir < cardCosts[card]) return;

            ws.send(JSON.stringify({
                type: "play_card",
                side: currentSide,
                card_id: selectedCard,
                x: cellX,
                y: cellY
            }));

            selectedCard = null;
            updateUI();
        });

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        async function animate() {
            requestAnimationFrame(animate);
            animateUnits();
            renderer.render(scene, camera);
        }

        joinGame();
        animate();
    </script>
</body>
</html>
